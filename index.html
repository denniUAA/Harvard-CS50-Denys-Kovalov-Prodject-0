<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Search</title>

</head>

<body class="d-flex justify-content-center align-items-center">
    <div id="header"></div>

    <main>
        <div class="mb-4"><img src="Image\Google_logo.png" alt="Google_logo" class="img-fluid w-75"></div>
        <form action="https://www.google.com/search" method="GET" class="mb-3 w-100 d-flex gap-2">
            <input type="text" name="q" class="form-control mb-2" placeholder="Search">
            <input type="submit" value="Google Search" class="btn btn-primary mb-2 w-50">
            <input type="submit" name="btnI" value="I’m Feeling Lucky" class="btn btn-primary mb-2 w-50">
        </form>

    </main>
    <div id="footer"></div>

    <script src="loeadHeaderAndFooter.js"></script>
</body>

</html>
