<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>Search</title>

</head>

<body class="d-flex justify-content-center align-items-center">
    <div id="header"></div>

    <main>
        <div class="mb-4"><img src="Image\Google_logo.png" alt="Google_logo" class="img-fluid w-75"></div>
        <form action="https://www.google.com/search" method="GET"
            class="d-flex flex-column gap-3 align-items-center mb-2 w-100">
            <input type="text" name="q" class="form-control" placeholder="Search">
            <div class="d-flex gap-3">
                <input type="submit" value="Google Search" class="btn btn-primary">
                <input type="submit" name="btnI" value="I’m Feeling Lucky" class="btn btn-primary">
            </div>
        </form>

    </main>
    <div id="footer"></div>

    <script src="loeadHeaderAndFooter.js"></script>
</body>

</html>
